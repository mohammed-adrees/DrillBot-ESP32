<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="monospace" font-size="11">
  <rect width="1000" height="720" fill="#1a1a2e"/>
  <text x="500" y="28" fill="#e0e0ff" font-size="16" font-weight="bold" text-anchor="middle">DrillBot — ESP32 Wiring Diagram</text>

  <!-- ===== ESP32 (center) ===== -->
  <rect x="380" y="260" width="130" height="200" rx="6" fill="#2d2d5e" stroke="#7b7bff" stroke-width="2"/>
  <text x="445" y="280" fill="#aaaaff" font-size="10" text-anchor="middle" font-weight="bold">ESP32</text>
  <!-- left pins -->
  <text x="388" y="300" fill="#88ff88" font-size="9">GPIO14 (IN1)</text>
  <text x="388" y="315" fill="#88ff88" font-size="9">GPIO27 (IN2)</text>
  <text x="388" y="330" fill="#88ff88" font-size="9">GPIO26 (IN3)</text>
  <text x="388" y="345" fill="#88ff88" font-size="9">GPIO25 (IN4)</text>
  <text x="388" y="360" fill="#ffcc44" font-size="9">GPIO33 (ENA)</text>
  <text x="388" y="375" fill="#ffcc44" font-size="9">GPIO32 (ENB)</text>
  <text x="388" y="395" fill="#ff8888" font-size="9">GPIO18 (D_IN1)</text>
  <text x="388" y="410" fill="#ff8888" font-size="9">GPIO19 (D_IN2)</text>
  <text x="388" y="425" fill="#ff8888" font-size="9">GPIO23 (D_ENA)</text>
  <text x="388" y="445" fill="#44ddff" font-size="9">GPIO13 (SERVO)</text>
  <text x="388" y="460" fill="#ff44ff" font-size="9">GPIO4  (BUZZER)</text>

  <!-- ===== CAR Motor Driver L298N (left) ===== -->
  <rect x="60" y="200" width="140" height="160" rx="6" fill="#1e3e1e" stroke="#44ff44" stroke-width="2"/>
  <text x="130" y="218" fill="#88ff88" font-size="10" text-anchor="middle" font-weight="bold">L298N — Car</text>
  <text x="70" y="238" fill="#aaffaa" font-size="9">IN1 ←</text>
  <text x="70" y="253" fill="#aaffaa" font-size="9">IN2 ←</text>
  <text x="70" y="268" fill="#aaffaa" font-size="9">IN3 ←</text>
  <text x="70" y="283" fill="#aaffaa" font-size="9">IN4 ←</text>
  <text x="70" y="298" fill="#ffdd88" font-size="9">ENA ←</text>
  <text x="70" y="313" fill="#ffdd88" font-size="9">ENB ←</text>
  <text x="70" y="333" fill="#ff6666" font-size="9">12V IN →</text>
  <text x="70" y="348" fill="#6688ff" font-size="9">GND →</text>
  <text x="70" y="353" fill="#ffffff" font-size="8">(+5V out → ESP32 VIN)</text>

  <!-- wires ESP32 → Car Driver -->
  <line x1="380" y1="297" x2="200" y2="236" stroke="#88ff88" stroke-width="1.2" stroke-dasharray="4,2"/>
  <line x1="380" y1="312" x2="200" y2="251" stroke="#88ff88" stroke-width="1.2" stroke-dasharray="4,2"/>
  <line x1="380" y1="327" x2="200" y2="266" stroke="#88ff88" stroke-width="1.2" stroke-dasharray="4,2"/>
  <line x1="380" y1="342" x2="200" y2="281" stroke="#88ff88" stroke-width="1.2" stroke-dasharray="4,2"/>
  <line x1="380" y1="357" x2="200" y2="296" stroke="#ffcc44" stroke-width="1.2" stroke-dasharray="4,2"/>
  <line x1="380" y1="372" x2="200" y2="311" stroke="#ffcc44" stroke-width="1.2" stroke-dasharray="4,2"/>

  <!-- ===== DC Motors (far left) ===== -->
  <rect x="20" y="80" width="90" height="44" rx="5" fill="#2a1a00" stroke="#ff9900" stroke-width="1.5"/>
  <text x="65" y="97" fill="#ffbb44" font-size="9" text-anchor="middle">Motor A</text>
  <text x="65" y="110" fill="#ffbb44" font-size="8" text-anchor="middle">Front-Left</text>

  <rect x="20" y="134" width="90" height="44" rx="5" fill="#2a1a00" stroke="#ff9900" stroke-width="1.5"/>
  <text x="65" y="151" fill="#ffbb44" font-size="9" text-anchor="middle">Motor B</text>
  <text x="65" y="164" fill="#ffbb44" font-size="8" text-anchor="middle">Front-Right</text>

  <rect x="20" y="400" width="90" height="44" rx="5" fill="#2a1a00" stroke="#ff9900" stroke-width="1.5"/>
  <text x="65" y="417" fill="#ffbb44" font-size="9" text-anchor="middle">Motor C</text>
  <text x="65" y="430" fill="#ffbb44" font-size="8" text-anchor="middle">Rear-Left</text>

  <rect x="20" y="454" width="90" height="44" rx="5" fill="#2a1a00" stroke="#ff9900" stroke-width="1.5"/>
  <text x="65" y="471" fill="#ffbb44" font-size="9" text-anchor="middle">Motor D</text>
  <text x="65" y="484" fill="#ffbb44" font-size="8" text-anchor="middle">Rear-Right</text>

  <!-- Motor wires to L298N Car -->
  <line x1="110" y1="102" x2="130" y2="220" stroke="#ff9900" stroke-width="1.5"/>
  <line x1="110" y1="156" x2="130" y2="240" stroke="#ff9900" stroke-width="1.5"/>
  <line x1="110" y1="422" x2="130" y2="330" stroke="#ff9900" stroke-width="1.5"/>
  <line x1="110" y1="476" x2="130" y2="350" stroke="#ff9900" stroke-width="1.5"/>

  <!-- ===== DRILL Motor Driver L298N (right) ===== -->
  <rect x="720" y="200" width="140" height="130" rx="6" fill="#3e1e1e" stroke="#ff4444" stroke-width="2"/>
  <text x="790" y="218" fill="#ff8888" font-size="10" text-anchor="middle" font-weight="bold">L298N — Drill</text>
  <text x="730" y="238" fill="#ffaaaa" font-size="9">IN1 ←</text>
  <text x="730" y="253" fill="#ffaaaa" font-size="9">IN2 ←</text>
  <text x="730" y="268" fill="#ff8888" font-size="9">ENA ←</text>
  <text x="730" y="288" fill="#ff6666" font-size="9">12V IN →</text>
  <text x="730" y="303" fill="#6688ff" font-size="9">GND →</text>
  <text x="730" y="318" fill="#ffffff" font-size="8">OUT → Drill Motor</text>

  <!-- wires ESP32 → Drill Driver -->
  <line x1="510" y1="392" x2="720" y2="236" stroke="#ff8888" stroke-width="1.2" stroke-dasharray="4,2"/>
  <line x1="510" y1="407" x2="720" y2="251" stroke="#ff8888" stroke-width="1.2" stroke-dasharray="4,2"/>
  <line x1="510" y1="422" x2="720" y2="266" stroke="#ff8888" stroke-width="1.2" stroke-dasharray="4,2"/>

  <!-- ===== Drill Motor ===== -->
  <rect x="850" y="200" width="100" height="50" rx="5" fill="#3e0000" stroke="#ff2222" stroke-width="1.5"/>
  <text x="900" y="220" fill="#ff8888" font-size="9" text-anchor="middle">Drill Motor</text>
  <text x="900" y="235" fill="#ff8888" font-size="8" text-anchor="middle">(High Torque)</text>
  <line x1="860" y1="225" x2="860" y2="225" stroke="#ff2222" stroke-width="0"/>
  <line x1="850" y1="225" x2="760" y2="285" stroke="#ff2222" stroke-width="1.5"/>

  <!-- ===== Servo Motor ===== -->
  <rect x="720" y="380" width="120" height="70" rx="5" fill="#002233" stroke="#44ddff" stroke-width="2"/>
  <text x="780" y="400" fill="#44ddff" font-size="10" text-anchor="middle" font-weight="bold">Servo Motor</text>
  <text x="730" y="420" fill="#88eeff" font-size="9">Signal ←</text>
  <text x="730" y="435" fill="#ff6666" font-size="9">VCC (5V) ←</text>
  <text x="730" y="450" fill="#6688ff" font-size="9">GND ←</text>
  <!-- wire ESP32 → Servo signal -->
  <line x1="510" y1="443" x2="720" y2="418" stroke="#44ddff" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- ===== Buzzer ===== -->
  <rect x="720" y="480" width="100" height="55" rx="5" fill="#220033" stroke="#ff44ff" stroke-width="2"/>
  <text x="770" y="500" fill="#ff44ff" font-size="10" text-anchor="middle" font-weight="bold">Buzzer</text>
  <text x="730" y="518" fill="#ff88ff" font-size="9">+ ← GPIO4</text>
  <text x="730" y="533" fill="#6688ff" font-size="9">− ← GND</text>
  <!-- wire ESP32 → Buzzer -->
  <line x1="510" y1="458" x2="720" y2="505" stroke="#ff44ff" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- ===== Battery ===== -->
  <rect x="400" y="560" width="130" height="55" rx="5" fill="#1a2a00" stroke="#aaff00" stroke-width="2"/>
  <text x="465" y="580" fill="#ccff44" font-size="10" text-anchor="middle" font-weight="bold">🔋 Battery Pack</text>
  <text x="465" y="596" fill="#ccff44" font-size="9" text-anchor="middle">11.1V LiPo / 3×18650</text>
  <text x="465" y="610" fill="#aaaaaa" font-size="8" text-anchor="middle">→ L298N (both) 12V IN</text>
  <!-- battery lines -->
  <line x1="410" y1="562" x2="130" y2="333" stroke="#aaff00" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="530" y1="562" x2="740" y2="288" stroke="#aaff00" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- ===== Power Regulator ===== -->
  <rect x="560" y="560" width="110" height="55" rx="5" fill="#221100" stroke="#ffaa00" stroke-width="1.5"/>
  <text x="615" y="578" fill="#ffcc44" font-size="9" text-anchor="middle" font-weight="bold">Buck Converter</text>
  <text x="615" y="592" fill="#ffcc44" font-size="8" text-anchor="middle">12V → 5V</text>
  <text x="615" y="606" fill="#aaaaaa" font-size="8" text-anchor="middle">→ ESP32 VIN + Servo</text>

  <!-- legend -->
  <rect x="20" y="570" width="340" height="130" rx="4" fill="#111128" stroke="#444466" stroke-width="1"/>
  <text x="30" y="588" fill="#aaaaff" font-size="11" font-weight="bold">PIN LEGEND</text>
  <line x1="30" y1="600" x2="50" y2="600" stroke="#88ff88" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="55" y="604" fill="#cccccc" font-size="9">Car motor driver signals</text>
  <line x1="30" y1="618" x2="50" y2="618" stroke="#ff8888" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="55" y="622" fill="#cccccc" font-size="9">Drill motor driver signals</text>
  <line x1="30" y1="636" x2="50" y2="636" stroke="#44ddff" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="55" y="640" fill="#cccccc" font-size="9">Servo signal (GPIO13)</text>
  <line x1="30" y1="654" x2="50" y2="654" stroke="#ff44ff" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="55" y="658" fill="#cccccc" font-size="9">Buzzer signal (GPIO4)</text>
  <line x1="30" y1="672" x2="50" y2="672" stroke="#aaff00" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="55" y="676" fill="#cccccc" font-size="9">Battery power lines (12V)</text>
  <line x1="30" y1="690" x2="50" y2="690" stroke="#ff9900" stroke-width="2"/>
  <text x="55" y="694" fill="#cccccc" font-size="9">DC Motor output wires</text>

  <!-- title bar -->
  <rect x="0" y="0" width="1000" height="40" fill="#111128"/>
  <text x="500" y="26" fill="#7b7bff" font-size="15" font-weight="bold" text-anchor="middle">DrillBot — ESP32 Wiring Diagram (Dabble Bluetooth Control)</text>
</svg>
